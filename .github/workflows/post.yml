name: Post next Reel
# Every day: take the next unposted video from the Google Drive folder and publish it as a Facebook Reel.
# Also runnable by hand from the Actions tab (dry run = download + check, post nothing).
run-name: "Post Reel ${{ github.event.inputs.dry_run == 'true' && '(dry run)' || '' }}"

on:
  schedule:
    - cron: "0 14 * * *"        # 14:00 UTC = 9:00 AM Miami (EST) / 5:00 PM Moscow. Change to taste.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check the next video but do not post it"
        type: boolean
        default: false
      file_id:
        description: "Post one specific Drive file ID instead of the next in the queue (blank = next)"
        required: false
        default: ""
      force:
        description: "Post even if that file was already posted"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-reel          # never two uploads at once
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post Reel
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          QUEUE_ORDER: ${{ vars.QUEUE_ORDER || 'name' }}
          DRY: ${{ github.event.inputs.dry_run }}
          FILE_ID: ${{ github.event.inputs.file_id }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          args=""
          [ "$DRY" = "true" ] && args="$args --dry-run"
          [ -n "$FILE_ID" ] && args="$args --file-id $FILE_ID"
          [ "$FORCE" = "true" ] && args="$args --force"
          python -m reels.run $args
      - name: Save the post log
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "echo-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/posted.json
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Reel log $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
