name: Post next Reel
# Every day: take the next unposted video from the Google Drive folder and publish it as a Facebook Reel.
# Also runnable by hand from the Actions tab (dry run = download + check, post nothing).
run-name: "Post Reel ${{ github.event.inputs.dry_run == 'true' && '(dry run)' || '' }}"

on:
  schedule:
    # Windows (Miami time, EST). The job starts at the window's opening and waits a random time inside it.
    - cron: "0 12 * * *"        # morning: 12:00 UTC = 7:00 AM EST, posts between 7:00 and 9:00
    - cron: "0 23 * * *"        # evening: 23:00 UTC = 6:00 PM EST, posts between 6:00 and 9:00 PM
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check the next video but do not post it"
        type: boolean
        default: false
      file_id:
        description: "Post one specific Drive file ID instead of the next in the queue (blank = next)"
        required: false
        default: ""
      force:
        description: "Post even if that file was already posted"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: post-reel          # never two uploads at once
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg (for ffprobe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Wait a random time inside the posting window
        if: github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "0 12 * * *" ]; then max=120; else max=180; fi   # minutes: 2 h morning, 3 h evening
          wait=$(( RANDOM % (max * 60) ))
          echo "Waiting $((wait / 60)) min before posting"
          sleep "$wait"
      - name: Post Reel
        env:
          SUMMARY_FILE: ${{ runner.temp }}/summary.txt
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          QUEUE_ORDER: ${{ vars.QUEUE_ORDER || 'name' }}
          DRY: ${{ github.event.inputs.dry_run }}
          FILE_ID: ${{ github.event.inputs.file_id }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          args=""
          [ "$DRY" = "true" ] && args="$args --dry-run"
          [ -n "$FILE_ID" ] && args="$args --file-id $FILE_ID"
          [ "$FORCE" = "true" ] && args="$args --force"
          python -m reels.run $args
      - name: Ping me
        if: always() && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_FILE: ${{ runner.temp }}/summary.txt
        run: |
          [ -s "$SUMMARY_FILE" ] || exit 0
          url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$(head -n1 "$SUMMARY_FILE" | cut -c1-120)" --body-file "$SUMMARY_FILE")
          gh issue close "$url" --repo "$GITHUB_REPOSITORY" || true
      - name: Save the post log
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "echo-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/posted.json
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Reel log $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
